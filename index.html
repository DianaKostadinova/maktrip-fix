<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Discover Macedonia — your pocket travel companion</title>
    <meta name="description" content="Plan and travel North Macedonia: places, food, a day-by-day trip helper, essentials, and nearby toilets, water and ATMs. Works offline." />

    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" href="/icons/logo.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />
    <meta name="theme-color" content="#d2141c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Macedonia" />

    <meta property="og:title" content="Discover Macedonia" />
    <meta property="og:description" content="Your pocket travel companion for North Macedonia." />
    <meta property="og:image" content="/media/hero-poster.webp" />

    <!-- Apply saved theme before first paint to avoid a flash. -->
    <script>
        try {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
    </script>
    <!-- Runtime config (written by the Docker entrypoint; empty in dev). -->
    <script src="/config.js"></script>
</head>
<body>
    <noscript>Discover Macedonia needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
