server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
  forward-headers-strategy: framework

spring:
  application:
    name: discover-macedonia-api
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 5m   # long-running streamed itineraries
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  planner:
    # The AI trip planner is "coming soon": off by default. Set PLANNER_ENABLED=true
    # (and run Ollama) to switch it on — nothing else needs to change.
    enabled: ${PLANNER_ENABLED:false}
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2:3b}
    temperature: 0.4
    timeout: PT4M
  news:
    ttl: PT20M
    feeds:
      - name: Google News
        url: "https://news.google.com/rss/search?q=North+Macedonia+travel+OR+tourism+OR+Skopje+OR+Ohrid+when:14d&hl=en-US&gl=US&ceid=US:en"
        strip-source-suffix: true
      - name: Meta.mk
        url: https://meta.mk/en/feed/
        strip-source-suffix: false

logging:
  level:
    mk.discovermacedonia: INFO
